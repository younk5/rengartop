<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entrar</title>
<link rel="icon" type="image/svg+xml" href="../img/favicon.svg" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav class="topnav">
    <div class="row container">
      <a class="brand" href="../index.html">
        <img
          src="https://static-cdn.jtvnw.net/badges/v1/38c766d4-f162-495d-9c67-efbb3811c7bb/3"
          srcset="https://static-cdn.jtvnw.net/badges/v1/38c766d4-f162-495d-9c67-efbb3811c7bb/2 1x, https://static-cdn.jtvnw.net/badges/v1/38c766d4-f162-495d-9c67-efbb3811c7bb/3 2x"
          alt="Badge do Canal"
          class="mark"
        />
        <span>Marlon547<small>Guia de Rengar</small></span>
      </a>
    </div>
  </nav>

<section class="section login-section">
  <div class="container">
    <div class="login-grid">

      <div class="login-intro">
        <span class="eyebrow"><span class="eyebrow-dot"></span>Acesso restrito</span>
        <h1 class="login-title">Área do<br /><span>Marlon</span></h1>
      </div>

      <form class="login-card" id="login-form">
        <div class="login-card-notch"></div>
        <label for="email">E-mail</label>
        <input type="email" id="email" required autocomplete="username" />
        <label for="password">Senha</label>
        <input type="password" id="password" required autocomplete="current-password" />
        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-full">Entrar</button>
        </div>
        <p class="status-msg" id="status"></p>
      </form>

    </div>
  </div>
</section>

<script type="module" src="js/login.js"></script>
</body>
</html>
